name: Replyly CI
# versionCode = GITHUB_RUN_NUMBER of this workflow. Renaming or recreating this file resets the
# counter, and a lower versionCode cannot install over the app on the phone.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: replyly-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # SHA-256 of the Replyly signing certificate (public value; the key itself is a repo secret).
  # Every APK published from main must carry it, or it would not install over Parag's app.
  REPLYLY_CERT_SHA256: 2a5421c6e33e74b81564f46164c12b4e3da53062d550ead603fb171eaa2737d6

jobs:
  check:
    name: Replyly checks (ktlint, lint, unit tests, debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0"

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Load the signing key (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          KEYSTORE_B64: ${{ secrets.REPLYLY_SIGNING_KEYSTORE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ]; then
            echo "::error::Secret REPLYLY_SIGNING_KEYSTORE_B64 is missing; refusing to build an APK that cannot update Parag's app."
            exit 1
          fi
          f="$RUNNER_TEMP/replyly-signing.p12"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$f"
          echo "REPLYLY_SIGNING_STORE_FILE=$f" >> "$GITHUB_ENV"

      - name: Run all gates
        env:
          # Only used when the step above set REPLYLY_SIGNING_STORE_FILE (main); PR builds use the
          # runner's throwaway debug key.
          REPLYLY_SIGNING_PASSWORD: ${{ secrets.REPLYLY_SIGNING_PASSWORD }}
        run: scripts/check.sh

      - name: Check the APK signing certificate (main only)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          actual=$("$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --print-certs app/build/outputs/apk/debug/app-debug.apk \
            | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)
          if [ "$actual" != "$REPLYLY_CERT_SHA256" ]; then
            echo "::error::APK certificate $actual does not match REPLYLY_CERT_SHA256."
            exit 1
          fi
          echo "Signed with the Replyly key ($actual)."

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replyly-screenshot-diffs
          # *_compare.png (reference | diff | new) and *_actual.png for every changed shot.
          path: |
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: replyly-reports
          path: app/build/reports/
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: replyly-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release-debug:
    name: Replyly latest-debug release
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: replyly-release-debug
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: latest-debug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: replyly-debug-apk
          path: apk

      - name: Move tag and replace APK
        run: |
          set -euo pipefail
          mv apk/app-debug.apk replyly-debug.apk
          notes="Debug build of ${GITHUB_SHA} (run ${GITHUB_RUN_NUMBER}, versionCode ${GITHUB_RUN_NUMBER}).
          ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}"

          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"

          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "Replyly debug (latest)" --notes "$notes"
            gh release upload "$TAG" replyly-debug.apk --clobber
          else
            gh release create "$TAG" replyly-debug.apk --title "Replyly debug (latest)" --notes "$notes" --verify-tag
          fi
